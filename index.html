<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <script>try{var m=localStorage.getItem("theme")||"system";document.documentElement.dataset.theme=m==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):m;document.documentElement.dataset.style=new URLSearchParams(location.search).get("style")||localStorage.getItem("style")||"standard"}catch(e){}</script>
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Library">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Digital Library</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
  <!-- styles (Settings > Style): shared HUD layer from the hub (templates/styles), then the library's HUD parts -->
  <link rel="stylesheet" href="css/styles/hud.css">
  <link rel="stylesheet" href="css/hud.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top">
    <a href="#/" class="brand">Library</a>
    <nav>
      <a href="#/">Books</a>
      <a href="#/search">Search</a>
      <a href="#/graph">Graph</a>
      <a href="#/timeline">Timeline</a>
      <a href="#/settings" aria-label="Settings" title="Settings">⚙</a>
    </nav>
    <span id="status" class="status" aria-live="polite"></span>
  </header>
  <main id="main"></main>
</body>
</html>
